services:
  - type: worker
    name: remind-me-telegram-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Tashkent
      - key: DATABASE_PATH
        value: /var/data/remind_me.db
    disk:
      name: remind-me-data
      mountPath: /var/data
      sizeGB: 1
